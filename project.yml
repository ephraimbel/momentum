name: Momentum
options:
  bundleIdPrefix: com.momentum
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # use the toolchain's default Swift mode (Xcode 26.2)
    DEVELOPMENT_TEAM: "LRDHWBMA87"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.0"      # must match the ASC version record EXACTLY — a build carries this string and can only attach to the matching version.
    CURRENT_PROJECT_VERSION: "18"   # build 18 (v1.2.0): App Review fixes — HealthKit priming (5.1.1(iv): Continue button, no skip) + Science & sources citations screen (1.4.1). Build 17: post-activity overhaul, Progress scale pass, portrait lock.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete   # engines are actors; enforce data-race safety early

# Maps: Mapbox Maps SDK (replaces MapKit for all map rendering). The binary frameworks download
# from api.mapbox.com via a DOWNLOADS:READ secret token in ~/.netrc (not committed); the runtime
# public token is injected from the untracked Secrets.xcconfig (MBX_ACCESS_TOKEN) into Info.plist's
# MBXAccessToken at build — never committed. Copy Secrets.xcconfig.example → Secrets.xcconfig and
# fill in your pk.* token.
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    from: "11.0.0"
  # Social backend + auth + storage (docs/SOCIAL-BACKEND-SETUP.md). Config-gated: the app ships
  # dark until SUPABASE_URL/SUPABASE_ANON_KEY are set in Secrets.xcconfig.
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"
# Phase 3 billing SDKs — uncomment with the Momentum-target deps below to go live (PRD §10).
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.0.0"
  # TikTok ads attribution (owner ask 2026-08-11). Config-gated: the app ships dark until
  # TIKTOK_APP_ID/TIKTOK_ACCESS_TOKEN are set in Secrets.xcconfig (TikTokAdsService).
  TikTokBusinessSDK:
    url: https://github.com/tiktok/tiktok-business-ios-sdk
    from: "1.7.1"
  # Meta ads attribution (owner ask 2026-08-11). Same dark-seam contract: never initialized
  # until META_APP_ID/META_CLIENT_TOKEN are set in Secrets.xcconfig (MetaAdsService).
  FacebookSDK:
    url: https://github.com/facebook/facebook-ios-sdk
    from: "18.1.0"
#   Superwall:
#     url: https://github.com/superwall/Superwall-iOS
#     from: "4.0.0"

targets:
  Momentum:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Momentum
    # Injects MBX_ACCESS_TOKEN (the Mapbox runtime token) from the untracked Secrets.xcconfig.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app
        TARGETED_DEVICE_FAMILY: "1"          # iPhone only — NOT a universal/iPad app (App Store supported-devices reads this)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Momentum/Resources/Momentum.entitlements
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Momentum/Resources/Info.plist
      properties:
        CFBundleDisplayName: momentum
        # Version keys derive from the single project-level MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # (settings.base) so the app, widget, and watch bundles ALWAYS match — App Store upload
        # validation rejects a build whose extension versions differ from the app's.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Export compliance: the app uses only standard, exemption-eligible HTTPS/TLS. Declaring this
        # here answers the question up front so every TestFlight/App Store upload skips the manual gate.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "momentum uses your location to map your run, ride, or walk and measure distance, pace, and speed."
        NSMotionUsageDescription: "momentum uses motion data to measure cadence and steps."
        NSBluetoothAlwaysUsageDescription: "momentum connects to a Bluetooth heart-rate monitor to show your live heart rate and zones during a run."
        NSCameraUsageDescription: "momentum uses the camera to scan food barcodes, to attach photos to a workout right after you finish it, and to take a photo for a share card."
        NSMicrophoneUsageDescription: "momentum uses the microphone so you can speak instead of typing — a meal, a workout, a question for your coach."
        NSSpeechRecognitionUsageDescription: "momentum uses speech recognition to turn what you say into text — meals, workouts, coach questions."
        NSHealthShareUsageDescription: "momentum reads heart rate, heart-rate variability, resting heart rate, sleep, body weight, and workout data to personalize your stats, recovery, and coaching."
        NSHealthUpdateUsageDescription: "momentum saves your completed workouts to Apple Health."
        NSSupportsLiveActivities: true          # rest-timer Live Activity (lock screen + Dynamic Island)
        UIUserInterfaceStyle: Automatic
        # Portrait-locked (2026-08-06 user call): no landscape anywhere — the app is a phone-in-hand
        # tracker, not a media app. Upside-down excluded too (Face ID iPhones ignore it anyway).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Mapbox runtime token — injected from Secrets.xcconfig (MBX_ACCESS_TOKEN) at build, so no
        # token is committed. The Maps SDK reads MBXAccessToken automatically at init.
        MBXAccessToken: "$(MBX_ACCESS_TOKEN)"
        # Supabase (auth, social backend, sync, AI edge functions). Injected from the untracked
        # Secrets.xcconfig — empty values → every network seam ships dark (deterministic
        # templates, local-only social). Setup: docs/SOCIAL-BACKEND-SETUP.md.
        SupabaseURL: "$(SUPABASE_URL)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        # OAuth deep-link callback (Google sign-in via ASWebAuthenticationSession) — the scheme
        # the Supabase web flow redirects back to (momentum://auth-callback).
        CFBundleURLTypes:
          - CFBundleURLName: com.ephraimbel.momentum.app.auth
            CFBundleURLSchemes:
              - momentum
        # Billing (PRD §10). Empty → local entitlement seam. Set these + link the SDKs to go live
        # (docs/MONETIZATION-SETUP.md). Read by `BillingKeys`.
        RevenueCatAPIKey: "appl_RCnCHIbAdYuSJAkzepPxxmnGVMJ"
        SuperwallAPIKey: ""
        # TikTok ads attribution — injected from the untracked Secrets.xcconfig; both empty →
        # TikTokAdsService never initializes the SDK (dark seam, same pattern as Supabase).
        TikTokAppID: "$(TIKTOK_APP_ID)"
        TikTokAccessToken: "$(TIKTOK_ACCESS_TOKEN)"
        # Meta ads attribution — same seam (MetaAdsService). The SDK only ever starts when
        # MetaAdsService.configure() decides to; these keys are its config, not an auto-start.
        FacebookAppID: "$(META_APP_ID)"
        FacebookClientToken: "$(META_CLIENT_TOKEN)"
        FacebookDisplayName: momentum
        # No IDFA collection — we never show the ATT prompt (SKAN-only posture, both networks).
        FacebookAdvertiserIDCollectionEnabled: false
        # SKAdNetwork attribution for TikTok + Meta ads — install attribution works via SKAN even
        # with no ATT prompt (we deliberately never ask; IDFA is off the table).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: 238da6jt44.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
        UILaunchScreen:
          UIColorName: background
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
    dependencies:
      - target: MomentumWidgets      # embeds the Live Activity / widget extension into the app
      - target: MomentumWatch        # embeds the watchOS app into the phone app (PRD §8.10)
        embed: true
      - package: MapboxMaps          # map rendering (Today, live route, heatmap, route suggestion)
      - package: Supabase            # auth (Sign in with Apple → JWT), social tables, photo storage
    # ── Phase 3 billing (RevenueCat + Superwall) ─────────────────────────
    # The integration code is already written behind `#if canImport(...)` (PaywallController);
    # uncomment these two lines + the `packages:` block below, set the Info.plist keys, then
    # `xcodegen generate`. Full runbook: docs/MONETIZATION-SETUP.md.
      - package: RevenueCat        # billing live 2026-07-15 (RC project "Momentum", entitlement `pro`, offering `default`)
    #   - package: Superwall       # not set up — RevenueCat-only per user; native PaywallView is the fallback
      - package: TikTokBusinessSDK # TikTok ads attribution (SKAN-only, no ATT) — TikTokAdsService
      - package: FacebookSDK       # Meta ads attribution (SKAN-only, no ATT) — MetaAdsService
        product: FacebookCore

  # WidgetKit/ActivityKit extension — hosts the rest-timer Live Activity. The shared
  # `RestActivityAttributes.swift` is compiled into BOTH this target and the app (Live Activity
  # requirement). Regenerate with `xcodegen generate` after adding widget files.
  MomentumWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumWidgets
      - path: Momentum/Features/Strength/RestActivityAttributes.swift   # shared with the app target
      - path: Momentum/Features/Cardio/CardioActivityAttributes.swift   # shared with the app target
      - path: Momentum/Features/Widgets/WidgetSnapshot.swift            # shared: app writes, widget reads
      - path: Momentum/Features/Widgets/TodayWidgetContent.swift        # shared: widget face + in-app preview harness
      # Brand faces on the lock screen — only the four cuts the Live Activities actually use.
      - path: Momentum/Resources/Fonts/Inter-SemiBold.ttf
      - path: Momentum/Resources/Fonts/Inter-Bold.ttf
      - path: Momentum/Resources/Fonts/SpaceGrotesk-Medium.ttf
      - path: Momentum/Resources/Fonts/SpaceGrotesk-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app.widgets
        TARGETED_DEVICE_FAMILY: "1"          # match the iPhone-only host app
        CODE_SIGN_ENTITLEMENTS: MomentumWidgets/MomentumWidgets.entitlements
    info:
      path: MomentumWidgets/Info.plist
      properties:
        CFBundleDisplayName: momentum
        # Same source as the app (MARKETING_VERSION) so the two never drift — a version mismatch
        # between the extension and the app is an App Store upload-validation failure.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf

  # watchOS complications + Smart Stack (readiness ring · today's plan). Reads ONLY the app-group
  # defaults the watch app caches from WatchConnectivity pushes — no HealthKit, no sessions.
  MomentumWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: MomentumWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app.watchkitapp.widgets
        CODE_SIGN_ENTITLEMENTS: MomentumWatchWidgets/MomentumWatchWidgets.entitlements
    info:
      path: MomentumWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: momentum
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # watchOS app (PRD §8.10 / §4.10) — on-wrist GPS cardio + strength logging. Shares only
  # platform-agnostic logic from the phone (enums, formatters, pure math); its views are watch-native.
  # Regenerate with `xcodegen generate` after adding watch files.
  MomentumWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: MomentumWatch
      - path: Momentum/Models/Enums.swift          # shared: WorkoutType / Discipline
      - path: Momentum/Utilities/Formatters.swift   # shared: SI → display formatting
      - path: Momentum/Engines/HRZones.swift        # shared: Karvonen zone model for the live zone gauge
      - path: Momentum/Engines/RouteSmoothing.swift # shared: spline smoothing for the summary route trace
      - path: Momentum/Engines/Geo.swift            # shared: haversine (RouteSmoothing dependency)
      - path: Momentum/Engines/WorkoutLogParser.swift # shared: the voice-log grammar (pure Swift — receipts on the wrist)
      - path: Momentum/Engines/StructuredWorkout.swift # shared: step model + tracker + pure builders (guided runs on the wrist; the PlannedSession-facing builder stays phone-side)
      - path: Momentum/Features/Plan/StructuredWorkoutSummary.swift # shared: step → human row labels (pure display math over Formatters)
    dependencies:
      - target: MomentumWatchWidgets   # embeds the complications extension into the watch app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: MomentumWatch/MomentumWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: MomentumWatch/Info.plist
      properties:
        CFBundleDisplayName: momentum
        # Match the phone app (MARKETING_VERSION) — a paired watch app with a mismatched version
        # fails App Store upload validation alongside the phone build.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.ephraimbel.momentum.app
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "momentum reads heart rate, distance, and energy during your workout to show live stats."
        NSHealthUpdateUsageDescription: "momentum saves your completed workouts to Apple Health."
        NSLocationWhenInUseUsageDescription: "momentum uses your location to draw your live route on the map during a workout."

  MomentumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumTests
    dependencies:
      - target: Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # XCUITest target — drives the real app through the live-run flow to confirm the Pause/Resume
  # control responds over the MapKit map (regression guard for the OversizedButton hit-testing fix).
  MomentumUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumUITests
    dependencies:
      - target: Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ephraimbel.momentum.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Momentum:
    build:
      targets:
        Momentum: all
        MomentumWidgets: all
        MomentumWatch: all
        MomentumWatchWidgets: all
        MomentumTests: [test]
        MomentumUITests: [test]
    test:
      targets:
        - MomentumTests
        - MomentumUITests

  # UI-tests only — runs the live-run Pause regression check without compiling the unit-test target.
  MomentumUITests:
    build:
      targets:
        Momentum: all
        MomentumWidgets: all
        MomentumUITests: [test]
    test:
      targets:
        - MomentumUITests

name: Momentum
options:
  bundleIdPrefix: com.momentum
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # use the toolchain's default Swift mode (Xcode 26.2)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete   # engines are actors; enforce data-race safety early

targets:
  Momentum:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_ENTITLEMENTS: Momentum/Resources/Momentum.entitlements
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    info:
      path: Momentum/Resources/Info.plist
      properties:
        CFBundleDisplayName: momentum
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "momentum uses your location to map your run, ride, or walk and measure distance, pace, and speed."
        NSMotionUsageDescription: "momentum uses motion data to measure cadence and steps."
        NSHealthShareUsageDescription: "momentum reads heart rate, body weight, and workout data to personalize your stats and coaching."
        NSHealthUpdateUsageDescription: "momentum saves your completed workouts to Apple Health."
        NSSupportsLiveActivities: true          # rest-timer Live Activity (lock screen + Dynamic Island)
        UIUserInterfaceStyle: Automatic
        # Athlete Model / AI read (ATHLETE-MODEL.md §7). Empty → deterministic-template path (ships
        # dark). To enable: set the project URL + anon key, then deploy `workout-analysis`.
        SupabaseURL: ""
        SupabaseAnonKey: ""
        UILaunchScreen:
          UIColorName: background
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
    dependencies:
      - target: MomentumWidgets      # embeds the Live Activity / widget extension into the app
    # ── Later-phase dependencies (NOT in the Phase 0 build) ──────────────
    # Add when their phase begins, then re-run `xcodegen generate`:
    #   Phase 2/4 — supabase-swift  (https://github.com/supabase/supabase-swift)
    #   Phase 3   — RevenueCat      (https://github.com/RevenueCat/purchases-ios)
    #   Phase 3   — Superwall       (https://github.com/superwall/Superwall-iOS)
    # dependencies:
    #   - package: supabase-swift
    #   - package: RevenueCat
    #   - package: Superwall

  # WidgetKit/ActivityKit extension — hosts the rest-timer Live Activity. The shared
  # `RestActivityAttributes.swift` is compiled into BOTH this target and the app (Live Activity
  # requirement). Regenerate with `xcodegen generate` after adding widget files.
  MomentumWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumWidgets
      - path: Momentum/Features/Strength/RestActivityAttributes.swift   # shared with the app target
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app.widgets
    info:
      path: MomentumWidgets/Info.plist
      properties:
        CFBundleDisplayName: momentum
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MomentumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumTests
    dependencies:
      - target: Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # XCUITest target — drives the real app through the live-run flow to confirm the Pause/Resume
  # control responds over the MapKit map (regression guard for the OversizedButton hit-testing fix).
  MomentumUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MomentumUITests
    dependencies:
      - target: Momentum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.momentum.app.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Momentum:
    build:
      targets:
        Momentum: all
        MomentumWidgets: all
        MomentumTests: [test]
        MomentumUITests: [test]
    test:
      targets:
        - MomentumTests
        - MomentumUITests

  # UI-tests only — runs the live-run Pause regression check without compiling the unit-test target.
  MomentumUITests:
    build:
      targets:
        Momentum: all
        MomentumWidgets: all
        MomentumUITests: [test]
    test:
      targets:
        - MomentumUITests
